# The notes `gh release create --generate-notes` writes (.github/workflows/release.yml): pull requests grouped by label.
# Priority and size are not labels (project "R-Type"), so the area and kind labels are all there is to group by.
changelog:
  categories:
    - title: Breaking changes
      labels:
        - breaking
    - title: New features
      labels:
        - enhancement
    - title: Fixes
      labels:
        - bug
    - title: Documentation
      labels:
        - documentation
    - title: Other changes
      labels:
        - "*"
