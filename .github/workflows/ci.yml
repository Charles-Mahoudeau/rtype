name: CI

on:
  push:
    branches: [main]
  # No base filter: in a stack, the pull requests above the first target the branch below, not main.
  # No types, so not edited: bots such as CodeRabbit edit the description of every pull request, and each edit started
  # a run whose jobs were all skipped. The cost: a pull request retargeted to main (the one below it merged) does not
  # become the top of its stack by itself; re-run its checks by hand (gh run rerun, or workflow_dispatch).
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  XMAKE_ACTION_BUILD_CACHE: "true"

jobs:
  # In a stack of pull requests (gh stack), the top one contains the whole stack: only it runs the checks, the others
  # skip them. The stack is read from the API, not from the event, which is a snapshot: a re-run replays it, and a pull
  # request stacked on top since then would not be seen.
  gate:
    name: Decide whether to run the checks
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.stack.outputs.run }}
      lint-base: ${{ steps.stack.outputs.lint-base }}
    steps:
      - name: Read the stack of the pull request
        id: stack
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$EVENT" != "pull_request" ]]; then
            # A push lints what it pushed; a manual run lints its branch since main (resolved by the lint job).
            [[ "$EVENT" == "push" && ! "$BEFORE" =~ ^0+$ ]] && base="$BEFORE" || base=""
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "lint-base=$base" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}")"
          if [[ "$(jq '.stack' <<< "$pr")" == "null" ]]; then
            echo "Not in a stack: running the checks."
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "lint-base=$(jq -r '.base.sha' <<< "$pr")" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          position="$(jq -r '.stack.position' <<< "$pr")"
          size="$(jq -r '.stack.size' <<< "$pr")"
          if [[ "$position" == "$size" ]]; then
            echo "Top of its stack (${position}/${size}): running the checks on the whole stack."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Pull request ${position}/${size} of its stack: the checks run on the top one only."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
          # Lint against the base of the whole stack, not the pull request below, to cover every pull request of it.
          echo "lint-base=$(jq -r '.stack.base.sha' <<< "$pr")" >> "$GITHUB_OUTPUT"

  # One job builds and tests: --Tests=y only adds the test targets, so this build covers the project's. The tests do
  # not run when it fails.
  build:
    name: Build and test
    needs: gate
    if: needs.gate.outputs.run == 'true'
    strategy:
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Linux dependencies
        if: contains(runner.os, 'linux')
        uses: ./.github/actions/setup-clang
        with:
          packages: vulkan-tools libvulkan-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxkbcommon-dev

      - name: Setup macOS dependencies
        if: contains(runner.os, 'macos')
        run: brew install molten-vk vulkan-loader glslang autoconf automake libtool pkg-config

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          actions-cache-folder: ".xmake-cache"
          actions-cache-key: "${{ matrix.os }}-compilation"

      # The key names the packages this job installs, read once the project is configured with the job's options but
      # before anything is installed (--require=no). `xmake l` does not load that configuration by itself, so the key
      # used to miss what the options add (GoogleTest, the examples' packages) and to change too seldom. A new key saves
      # a new cache, since a saved one can never be replaced.
      - name: Locate xmake packages
        id: packages
        shell: bash
        env:
          XMAKE_ROOT: y
        run: |
          xmake repo --update
          xmake f -y --Tests=y --require=no
          echo "hash=$(xmake l -c 'import("core.project.config"); config.load(); import("utils.ci.packageskey")()' | tr -d '\r')" >> "$GITHUB_OUTPUT"
          echo "dir=$(xmake l -c 'import("core.package.package"); print(package.installdir())' | tr -d '\r')" >> "$GITHUB_OUTPUT"

      - name: Restore package cache
        id: package-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.packages.outputs.dir }}
          key: xmake-package-cache-${{ matrix.os }}-tests-${{ steps.packages.outputs.hash }}
          restore-keys: xmake-package-cache-${{ matrix.os }}-tests-

      - name: Restore build cache
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: build/.build_cache
          key: xmake-build-cache-${{ matrix.os }}-tests-${{ hashFiles('**/xmake.lua', 'src/**', 'tests/**') }}
          restore-keys: xmake-build-cache-${{ matrix.os }}-tests-

      - name: Prefetch package sources
        shell: bash
        run: .github/scripts/prefetch-sources.sh "$RUNNER_TEMP/xmake-sources"

      # --require=yes: the configuration keeps the --require=no the key was read with, and would install nothing.
      - name: Build project and tests
        run: |
          xmake f -y --Tests=y --require=yes
          xmake build -y
        timeout-minutes: 30

      # Saved as the build left it. `xmake require --clean` must not run before: it uninstalls the packages no project
      # references, among them the dependencies of a package found installed (OpenSSL under libcurl), so the cache was
      # saved without them and every run built them again.
      - name: Save package cache
        if: github.ref == 'refs/heads/main' && steps.package-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.packages.outputs.dir }}
          key: ${{ steps.package-cache.outputs.cache-primary-key }}

      - name: Save build cache
        if: github.ref == 'refs/heads/main' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/.build_cache
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      - name: Run tests
        run: xmake test -v -y

  # Lint uses no build output: it runs next to the build instead of after it.
  lint:
    name: Check code style with clang-format and clang-tidy
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # clang is the compiler of the compile database clang-tidy reads, as in the build: same version everywhere.
      - name: Setup Linux dependencies
        id: clang
        uses: ./.github/actions/setup-clang
        with:
          tools: "true"
          packages: vulkan-tools libvulkan-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev libxkbcommon-dev

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          actions-cache-folder: ".xmake-cache"
          actions-cache-key: "ubuntu-latest-compilation"

      - name: Locate xmake packages
        id: packages
        shell: bash
        env:
          XMAKE_ROOT: y
        run: |
          xmake repo --update
          xmake f -y --Tests=y --AllExamples=y --require=no
          echo "hash=$(xmake l -c 'import("core.project.config"); config.load(); import("utils.ci.packageskey")()' | tr -d '\r')" >> "$GITHUB_OUTPUT"
          echo "dir=$(xmake l -c 'import("core.package.package"); print(package.installdir())' | tr -d '\r')" >> "$GITHUB_OUTPUT"

      # Its own cache: the examples need packages the build job does not (SFML, SDL3, freetype...), which it built again
      # on every run when it borrowed that job's cache.
      - name: Restore package cache
        id: package-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.packages.outputs.dir }}
          key: xmake-package-cache-ubuntu-latest-lint-${{ steps.packages.outputs.hash }}
          restore-keys: xmake-package-cache-ubuntu-latest-lint-

      - name: Prefetch package sources
        shell: bash
        run: .github/scripts/prefetch-sources.sh "$RUNNER_TEMP/xmake-sources"

      # --require=yes: the configuration keeps the --require=no the key was read with, and would install nothing.
      - name: Configure xmake
        run: xmake f -y --Tests=y --AllExamples=y --require=yes

      - name: Save package cache
        if: github.ref == 'refs/heads/main' && steps.package-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.packages.outputs.dir }}
          key: ${{ steps.package-cache.outputs.cache-primary-key }}

      - name: Generate compile_commands.json
        run: xmake project -k compile_commands

      # Sources include the SPIR-V headers the glsl.spirv rule generates (sprite.vert.h...): compile the shaders only,
      # no C++, so clang-tidy finds them.
      - name: Generate the embedded shader headers
        run: |
          xmake build -y --files="src/rtype/render/vulkan/shaders/*" render-vulkan
          xmake build -y --files="tests/vulkan/shaders/*" vulkan-tests

      # The base comes from the gate job: the base of the whole stack for a pull request, the previous head of main for
      # a push. A manual run (or a push without a previous head) lints its branch since main, or its last commit on
      # main.
      - name: Find the base of the changes
        id: base
        env:
          BASE: ${{ needs.gate.outputs.lint-base }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          base="$BASE"
          if [[ -n "$base" ]] && ! git cat-file -e "${base}^{commit}" 2> /dev/null; then
            git fetch --no-tags origin "$base" || { echo "::error::Cannot fetch the base ${base}"; exit 1; }
          fi
          if [[ -z "$base" ]]; then
            base="$(git merge-base "origin/${DEFAULT_BRANCH}" HEAD)"
            if [[ "$base" == "$(git rev-parse HEAD)" ]]; then
              base="$(git rev-parse HEAD~1)"
            fi
          fi
          echo "Linting the changes since ${base}"
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      - name: Check the changed files with clang-format and clang-tidy
        env:
          CLANG_FORMAT: clang-format-${{ steps.clang.outputs.version }}
          CLANG_TIDY: clang-tidy-${{ steps.clang.outputs.version }}
        run: bash .github/scripts/lint.sh "${{ steps.base.outputs.sha }}"
