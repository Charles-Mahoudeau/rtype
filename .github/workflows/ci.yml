name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  XMAKE_ACTION_BUILD_CACHE: "true"

jobs:
  build:
    name: Build and verify binaries
    strategy:
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Linux dependencies
        if: contains(runner.os, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y vulkan-tools libvulkan-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

      - name: Setup macOS dependencies
        if: contains(runner.os, 'macos')
        run: brew install molten-vk vulkan-loader glslang

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          actions-cache-folder: ".xmake-cache"
          actions-cache-key: "${{ matrix.os }}-compilation"

      - name: Locate xmake packages
        id: packages
        shell: bash
        env:
          XMAKE_ROOT: y
        run: |
          xmake repo --update
          echo "hash=$(xmake l utils.ci.packageskey | tr -d '\r')" >> "$GITHUB_OUTPUT"
          echo "dir=$(xmake l -c 'import("core.package.package"); print(package.installdir())' | tr -d '\r')" >> "$GITHUB_OUTPUT"

      - name: Restore package cache
        id: package-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.packages.outputs.dir }}
          key: xmake-package-cache-${{ matrix.os }}-compilation-${{ steps.packages.outputs.hash }}
          restore-keys: xmake-package-cache-${{ matrix.os }}-compilation-

      - name: Restore build cache
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: build/.build_cache
          key: xmake-build-cache-${{ matrix.os }}-compilation-${{ hashFiles('**/xmake.lua', 'src/**', 'tests/**') }}
          restore-keys: xmake-build-cache-${{ matrix.os }}-compilation-

      - name: Build project
        run: |
          xmake f -y
          xmake build -y
        timeout-minutes: 30

      - name: Remove unused packages
        if: github.ref == 'refs/heads/main' && steps.package-cache.outputs.cache-hit != 'true'
        run: xmake require --clean --clean_modes=package -y

      - name: Save package cache
        if: github.ref == 'refs/heads/main' && steps.package-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.packages.outputs.dir }}
          key: ${{ steps.package-cache.outputs.cache-primary-key }}

      - name: Save build cache
        if: github.ref == 'refs/heads/main' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/.build_cache
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

  test:
    name: Run tests
    needs: build
    strategy:
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Linux dependencies
        if: contains(runner.os, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y vulkan-tools libvulkan-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

      - name: Setup macOS dependencies
        if: contains(runner.os, 'macos')
        run: brew install molten-vk vulkan-loader glslang

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          actions-cache-folder: ".xmake-cache"
          actions-cache-key: "${{ matrix.os }}-compilation"

      - name: Locate xmake packages
        id: packages
        shell: bash
        env:
          XMAKE_ROOT: y
        run: |
          xmake repo --update
          echo "hash=$(xmake l utils.ci.packageskey | tr -d '\r')" >> "$GITHUB_OUTPUT"
          echo "dir=$(xmake l -c 'import("core.package.package"); print(package.installdir())' | tr -d '\r')" >> "$GITHUB_OUTPUT"

      - name: Restore package cache
        id: package-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.packages.outputs.dir }}
          key: xmake-package-cache-${{ matrix.os }}-tests-${{ steps.packages.outputs.hash }}
          restore-keys: xmake-package-cache-${{ matrix.os }}-tests-

      - name: Restore build cache
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: build/.build_cache
          key: xmake-build-cache-${{ matrix.os }}-tests-${{ hashFiles('**/xmake.lua', 'src/**', 'tests/**') }}
          restore-keys: xmake-build-cache-${{ matrix.os }}-tests-

      - name: Build tests
        run: |
          xmake f -y --Tests=y
          xmake build -y
        timeout-minutes: 30

      - name: Remove unused packages
        if: github.ref == 'refs/heads/main' && steps.package-cache.outputs.cache-hit != 'true'
        run: xmake require --clean --clean_modes=package -y

      - name: Save package cache
        if: github.ref == 'refs/heads/main' && steps.package-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.packages.outputs.dir }}
          key: ${{ steps.package-cache.outputs.cache-primary-key }}

      - name: Save build cache
        if: github.ref == 'refs/heads/main' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/.build_cache
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      - name: Run tests
        run: xmake test -v -y

  lint:
    name: Check code style with clang-format and clang-tidy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-format-20 clang-tidy-20 \
            vulkan-tools libvulkan-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          actions-cache-folder: ".xmake-cache"
          actions-cache-key: "ubuntu-latest-compilation"

      - name: Locate xmake packages
        id: packages
        shell: bash
        env:
          XMAKE_ROOT: y
        run: |
          xmake repo --update
          echo "hash=$(xmake l utils.ci.packageskey | tr -d '\r')" >> "$GITHUB_OUTPUT"
          echo "dir=$(xmake l -c 'import("core.package.package"); print(package.installdir())' | tr -d '\r')" >> "$GITHUB_OUTPUT"

      - name: Restore package cache
        id: package-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.packages.outputs.dir }}
          key: xmake-package-cache-ubuntu-latest-tests-${{ steps.packages.outputs.hash }}
          restore-keys: xmake-package-cache-ubuntu-latest-tests-

      - name: Configure xmake
        run: xmake f -y --Tests=y

      - name: Generate compile_commands.json
        run: xmake project -k compile_commands

      # Sources include the SPIR-V headers the glsl.spirv rule generates (sprite.vert.h...): compile the shaders only,
      # no C++, so clang-tidy finds them.
      - name: Generate the embedded shader headers
        run: |
          xmake build -y --files="src/rtype/render/vulkan/shaders/*" render-vulkan
          xmake build -y --files="tests/vulkan/shaders/*" vulkan-tests

      - name: Run cpp-linter
        uses: cpp-linter/cpp-linter-action@v2
        id: linter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: "22"
          style: "file"
          tidy-checks: ""
          database: "."
          ignore: ".github"
          step-summary: true

      - name: Fail fast if checks failed
        if: steps.linter.outputs.checks-failed > 0
        run: exit 1
