name: Bug
description: Something that does not work as documented.
title: "[Area] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Title: `[Area] <summary>`. After submitting, in the project "R-Type": set **Status**, **Priority** and **Size**.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Also the label applied to the issue.
      options:
        - ecs
        - luau
        - scripting
        - network
        - physics
        - Vulkan
        - documentation
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you see, with the error message or output.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Commands, a game folder or a script that shows it.
      value: |
        1.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, compiler, GPU if relevant, and the commit.
      placeholder: Linux, clang 21, commit abc1234
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Suspected cause, workarounds, related issues.
