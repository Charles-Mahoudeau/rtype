name: Luau Feature
description: A unit of work on the Luau scripting wrapper or its engine integration.
title: "[Luau Feature] "
labels: ["enhancement", "luau"]
body:
  - type: markdown
    attributes:
      value: |
        Describe one deliverable. Keep it small enough to be reviewed in a single PR.
        After submitting, set weight, difficulty and priority in the project, link the issue to its epic as a sub-issue, and add any blocking issues in the issue's relationships.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What must be built, in one or two sentences.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why it is needed and how it fits in the Luau wrapper or the engine's scripting.
    validations:
      required: true

  - type: textarea
    id: api
    attributes:
      label: C++ API and Luau usage
      description: The intended C++ signature or registration code, and how a script uses it from Luau.
      placeholder: |
        ```c++
        rt.globals().function("example").bind(/* ... */);
        ```
        ```luau
        example()
        ```
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: Tasks
      description: Checklist of concrete steps.
      value: |
        - [ ]
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable conditions that make this issue done.
      value: |
        - [ ] Builds with `xmake` on Linux, Windows and macOS
        - [ ] Script failures are returned as `Result<T>`, no exception crosses the C++/Luau boundary
        - [ ] Unit tests cover the success and failure paths
        - [ ] Passes `clang-format` and `clang-tidy`
    validations:
      required: true

  - type: textarea
    id: technical
    attributes:
      label: Technical notes
      description: Design choices, Luau API details, error handling, sandboxing or threading implications, pitfalls.

  - type: textarea
    id: references
    attributes:
      label: References
      description: Links to https://luau.org docs, the Luau API proposal, or related issues and PRs.

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - core
        - bindings
        - sandboxing
        - coroutines
        - hot-reload
        - multithreading
        - tooling
        - gameplay-scripts
        - docs-tests
    validations:
      required: true
